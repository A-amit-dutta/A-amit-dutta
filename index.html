<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Refactored Snake</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Snake — Refactored</h1>
    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="pauseBtn">Pause</button>
      <button id="resetBtn">Reset</button>
      <label>Speed: <input id="speed" type="range" min="4" max="20" value="10"></label>
      <span id="score">Score: 0</span>
    </div>
    <canvas id="game" width="600" height="600" aria-label="Snake game"></canvas>
  </div>
  <script type="module" src="snake.js"></script>
</body>
</html>
